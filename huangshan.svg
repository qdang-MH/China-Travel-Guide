
:root{
 --red:#7f1d2d;--red-dark:#4d111b;--gold:#c89b4b;--cream:#f6f0e5;--paper:#fffdf8;
 --ink:#2d2924;--muted:#6e675e;--border:#ded5c8;--shadow:0 18px 45px rgba(45,30,20,.10);--radius:18px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.65}
a{color:inherit}.container{width:min(1120px,calc(100% - 36px));margin:auto}
.site-header{position:sticky;top:0;z-index:50;background:rgba(255,253,248,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.navbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-family:Georgia,serif;font-size:1.5rem;color:var(--red);text-decoration:none;font-weight:bold}
.nav-links{display:flex;gap:18px;flex-wrap:wrap}.nav-links a{text-decoration:none;font-weight:bold;font-size:.9rem}.nav-links a:hover{color:var(--red)}
.hero{min-height:720px;position:relative;display:flex;align-items:center;color:white;background-size:cover;background-position:center;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,7,10,.91),rgba(45,13,18,.58),rgba(45,13,18,.12))}
.hero-content{position:relative;z-index:2;padding:90px 0;max-width:900px}
.eyebrow,.section-label{color:var(--gold);font-size:.78rem;font-weight:bold;letter-spacing:.15em;text-transform:uppercase;margin:0 0 10px}
.hero h1,.page-hero h1{font-family:Georgia,serif;font-weight:normal;letter-spacing:-.045em;line-height:.96;margin:0}
.hero h1{font-size:clamp(4rem,10vw,7.6rem)}.hero h2{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.8rem);font-weight:normal;color:#fff2d6;margin:18px 0 10px;line-height:1.1}
.hero-subtitle{font-family:Georgia,serif;font-size:1.3rem;font-style:italic;color:#efd5ae}.hero-description{max-width:760px;font-size:1.05rem;color:rgba(255,255,255,.9)}
.button-row,.hero-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.button{display:inline-block;padding:13px 20px;border-radius:999px;text-decoration:none;font-weight:bold;border:1px solid transparent}
.button-primary{background:var(--gold);color:#2a1b10}.button-secondary{border-color:rgba(255,255,255,.52);background:rgba(255,255,255,.08);color:white}.button-outline{border-color:var(--red);color:var(--red)}
.section{padding:82px 0}.section-muted{background:var(--cream)}.section h2{font-family:Georgia,serif;font-weight:normal;color:var(--red-dark);font-size:clamp(2.2rem,4vw,3.4rem);line-height:1.15;margin:0 0 18px}
.lead{font-family:Georgia,serif;font-size:1.2rem;color:#4f4942;max-width:860px}
.grid{display:grid;gap:22px}.cards-3{grid-template-columns:repeat(3,1fr)}.cards-4{grid-template-columns:repeat(4,1fr)}
.card,.day-card,.hotel-card,.attraction-card,.food-card,.info-box,.dashboard-card{background:white;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:28px}.card h3,.hotel-card h3,.attraction-card h3,.food-card h3,.info-box h3{font-family:Georgia,serif;color:var(--red-dark);font-size:1.4rem;margin:8px 0 10px}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tag{background:var(--cream);border-radius:999px;padding:6px 10px;font-size:.76rem;font-weight:bold;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}.dashboard-card{padding:22px}.dashboard-card span{display:block;color:var(--muted);font-size:.72rem;font-weight:bold;letter-spacing:.08em;text-transform:uppercase}.dashboard-card strong{display:block;color:var(--red-dark);font-family:Georgia,serif;font-size:1.3rem;margin-top:5px}
.route-map{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:stretch;margin-top:32px}.route-stop{position:relative;padding:24px;background:white;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none}.route-stop:not(:last-child)::after{content:"→";position:absolute;right:-18px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:1.5rem;z-index:3}.route-stop strong{display:block;font-family:Georgia,serif;color:var(--red-dark);font-size:1.3rem}.route-stop span{display:block;color:var(--muted);font-size:.8rem;margin-top:5px}
.page-hero{min-height:470px;display:flex;align-items:flex-end;color:white;background-size:cover;background-position:center;position:relative}.page-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,8,10,.88),rgba(20,8,10,.12))}
.page-hero-inner{position:relative;z-index:2;padding:80px 0}.page-hero h1{font-size:clamp(3rem,7vw,6rem)}.page-hero .lead{color:#f6ead8}
.destination-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:start}.info-box{padding:26px}.quick-list{list-style:none;padding:0;margin:0}.quick-list li{padding:10px 0;border-bottom:1px solid var(--border)}.quick-list li:last-child{border-bottom:0}
.hotel-card{padding:28px}.price{display:block;color:var(--red);font-weight:bold;font-size:1.16rem;margin:8px 0}
.attraction-grid,.food-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.attraction-card,.food-card{padding:24px}
.day-jump{position:sticky;top:68px;z-index:40;background:rgba(255,253,248,.97);border-bottom:1px solid var(--border);overflow-x:auto}.day-jump-inner{display:flex;gap:7px;align-items:center;min-width:max-content;padding:11px 0}.day-jump a{min-width:34px;height:34px;padding:0 9px;border:1px solid var(--border);border-radius:999px;background:white;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--red);font-size:.8rem;font-weight:bold}.day-jump a.active{background:var(--red);color:white;border-color:var(--red)}
.day-list{display:grid;gap:28px;margin-top:34px}.day-card{overflow:hidden}.day-head{display:flex;gap:18px;align-items:center;padding:26px 28px 15px}.day-badge{min-width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--red);color:white;font-family:Georgia,serif;font-weight:bold}.day-head h2{margin:0;font-size:1.85rem}.day-location{margin:0;color:var(--gold);font-weight:bold;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
.day-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:0 28px 12px;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--border)}.day-summary div{padding:15px;background:#fffaf1}.day-summary span,.day-summary strong{display:block}.day-summary span{color:var(--muted);font-size:.67rem;font-weight:bold;text-transform:uppercase;letter-spacing:.08em}.day-summary strong{margin-top:4px;color:var(--red-dark);font-size:.86rem}
.timeline{padding:0 28px}.timeline-row{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--border)}.timeline-row time{color:var(--gold);font-size:.76rem;font-weight:bold;text-transform:uppercase}.timeline-row h3{margin:0 0 6px;color:var(--red-dark);font-family:Georgia,serif}.timeline-row p{margin:0}
.day-footer{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--cream);padding:18px 28px}.day-footer strong{display:block;color:var(--red-dark)}
.day-nav{display:flex;justify-content:space-between;gap:15px;padding:15px 28px 20px;border-top:1px solid var(--border)}.day-nav a{text-decoration:none;color:var(--red);font-weight:bold}
.footer{background:#28181b;color:rgba(255,255,255,.84);padding:40px 0}.footer-inner{display:flex;justify-content:space-between;gap:20px}.footer a{color:white}
@media(max-width:980px){.cards-4,.route-map{grid-template-columns:repeat(2,1fr)}.cards-3,.dashboard-grid{grid-template-columns:repeat(2,1fr)}.destination-layout{grid-template-columns:1fr}.route-stop::after{display:none}}
@media(max-width:720px){.nav-links{display:none}.hero{min-height:650px}.cards-3,.cards-4,.dashboard-grid,.route-map,.attraction-grid,.food-grid,.day-summary{grid-template-columns:1fr}.timeline-row{grid-template-columns:1fr;gap:5px}.day-footer{grid-template-columns:1fr}.footer-inner{flex-direction:column}}
@media print{.site-header,.day-jump,.button-row,.hero-buttons,.day-nav{display:none!important}.hero,.page-hero{min-height:6in;break-after:page}.day-card,.card,.hotel-card,.attraction-card,.food-card{box-shadow:none;break-inside:avoid}.section{padding:35px 0}}
